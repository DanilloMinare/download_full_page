<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opções da captura</title>
  <link rel="icon" href="icons/icon16.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 20px; margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
    fieldset {
      margin: 0 0 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    legend { padding: 0 6px; font-weight: 600; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .help { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    #saved { color: var(--muted); margin-left: 8px; }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon48.png" alt="" width="28" height="28"> Opções</h1>

    <fieldset>
      <legend>Depois de capturar</legend>
      <label><input type="checkbox" name="openEditor"> Abrir direto no editor</label>
    </fieldset>

    <fieldset>
      <legend>Qualidade do JPG e do PDF</legend>
      <label>
        <input type="range" name="jpgQuality" min="0.5" max="1" step="0.01">
        <span id="qualityValue"></span>
      </label>
    </fieldset>

    <fieldset>
      <legend>PDF</legend>
      <label><input type="radio" name="pdfMode" value="single"> Página única, do tamanho da captura</label>
      <label><input type="radio" name="pdfMode" value="a4"> Dividir em páginas A4 (bom para imprimir)</label>
    </fieldset>

    <fieldset>
      <legend>Espera entre quadros</legend>
      <label>
        <input type="number" name="extraDelay" min="0" max="5000" step="50" style="width: 100px"> ms extras
      </label>
      <p class="help">Aumente se a página carrega imagens ou animações enquanto rola e elas saem em branco na captura.</p>
    </fieldset>

    <fieldset>
      <legend>Atalho</legend>
      <p class="help">Padrão: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>. Para mudar, abra
        <a href="#" id="shortcuts">chrome://extensions/shortcuts</a>.</p>
    </fieldset>

    <button id="save" class="primary">Salvar</button><span id="saved"></span>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
